# Supabase local development configuration
# Run `supabase start` to spin up local Supabase stack
# Run `supabase functions deploy <function-name>` to deploy Edge Functions

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.sms]
enable_signup = false  # accounts are created server-side only
enable_confirmations = true
# Handled by send-sms Edge Function hook — not configured here

[functions.register]
enabled = true
verify_jwt = false  # called pre-login from the web registration page, no session yet
entrypoint = "./functions/register/index.ts"

[functions.login]
enabled = true
verify_jwt = false  # phone+password login has no session/JWT to verify
entrypoint = "./functions/login/index.ts"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[functions.reset-password]
enabled = true
verify_jwt = false  # caller proves phone ownership with a Firebase OTP token
entrypoint = "./functions/reset-password/index.ts"

[functions.payments]
enabled = true
verify_jwt = false  # admin routes use a custom admin JWT; /initiate and /lookup are pre-login
entrypoint = "./functions/payments/index.ts"
